# Trivy scan waivers for this module.
#
# This is the machine-applied source of truth for security-scan exceptions: it is passed to Trivy
# with --ignorefile by `just scan`, `just validate` and the CI scan, so a waived finding stops
# failing the build. Every entry MUST also have a row in the "Security scan exceptions" table in
# HEADER.md, with the same id and a justification, so the waiver is auditable.
#
# Rules:
#   - Only waive a finding you have a real, defensible reason to waive. HIGH/CRITICAL is otherwise
#     merge-blocking (see the Libre DevOps Terraform standard); a waiver is a deliberate, reviewed
#     decision, never a way to quiet a finding you should fix.
#   - Prefer scoping with paths so the waiver only applies where intended.
#   - Where the finding is out of this module's scope, point the justification at the Libre DevOps
#     module that does address it.
misconfigurations:
  - id: AVD-AZU-0012
    paths:
      - "**/.terraform/modules/**"
      - "libre-devops/**"
    statement: >-
      Storage account network rules default action, raised against the DEPENDENCY module
      libre-devops/logic-app-standard/azurerm, which this module composes with and does not own.
      Trivy follows registry module sources during a scan, so a finding inside the host module
      surfaces here even though nothing in this repository declares that resource. This module's
      own example sets default_action Deny with the AzureServices bypass, so the finding is fixed
      wherever this repository is actually responsible for it. The host module carries its own
      documented waiver for the same id, and its reasoning is correct rather than a dodge: a Logic
      App Standard reaches its runtime storage from platform ranges, so IP allow-listing is not a
      reliable lockdown and deny-by-default would break the app. The working lockdown is VNet
      integration plus private endpoints, which is caller topology. This waiver is scoped to
      downloaded module paths only, so it can never mask a finding in this repository's own code.
